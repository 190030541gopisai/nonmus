services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: nonmus_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=nonmus
    volumes:
      - nonmus_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nonmus" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nonmus-net

  redis:
    image: redis
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nonmus-net

  nonmus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonmus_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-my_secret_key_this_should_be_very_long_and_secure_change_in_production}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nonmus-net

  nonmus-nginx:
    build:
      context: ./frontend/nonmus
      dockerfile: Dockerfile
    container_name: nonmus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - nonmus-api
    networks:
      - nonmus-net

volumes:
  nonmus_data:
  redis_data:

networks:
  nonmus-net:
    driver: bridge
