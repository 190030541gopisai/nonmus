services:
  nonmus:
    image: postgres
    restart: unless-stopped
    container_name: nonmus_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=nonmus
    volumes:
      - nonmus_data:/var/lib/postgresql

    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nonmus" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nonmus_data: