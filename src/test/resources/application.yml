spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret-key: my_secret_key_this_should_be_very_long_and_secure_change_in_production
  jwt-expiration-ms: 3600000 # 60 min
  refresh-token-expiration-ms: 604800000 # 7 days
  remember-me-refresh-token-expiration-ms: 2592000000 # 30 days

app:
  storage:
    profile-picture-bucket: nonmus-profile-pics
    # How long the presigned PUT URL is valid (client must complete upload within this window)
    upload-expiry-seconds: 600        # 10 minutes
    # How long a presigned GET URL is valid (frontend should refresh after expiry)
    view-expiry-seconds: 3600         # 1 hour
    # Maximum allowed file size for profile pictures in bytes (5 MB)
    max-profile-picture-bytes: 5242880
    # Allowed MIME types for profile pictures
    allowed-image-types: [ image/jpeg, image/png, image/webp, image/gif ]
    channel-logo-bucket: nonmus-channel
  email:
    verification:
      link: https://localhost:5173/verify-email?token=

aws:
  region: us-east-1
  s3:
    endpoint: http://localhost.floci.io:4566
  access-key: test
  secret-key: test
