spring:
  application:
    name: nonmus
  datasource:
    url: jdbc:postgresql://localhost:5432/nonmus
    username: postgres
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET:my_secret_key_this_should_be_very_long_and_secure_change_in_production}
  expiration: 3600000
  refresh-expiration: 604800000

app:
  storage:
    profile-picture-bucket: nonmus-profile-pics
    # How long the presigned PUT URL is valid (client must complete upload within this window)
    upload-expiry-seconds: 600        # 10 minutes
    # How long a presigned GET URL is valid (frontend should refresh after expiry)
    view-expiry-seconds: 3600         # 1 hour
    # Maximum allowed file size for profile pictures in bytes (5 MB)
    max-profile-picture-bytes: 5242880
    # Allowed MIME types for profile pictures
    allowed-image-types: [ image/jpeg, image/png, image/webp, image/gif ]
    channel-logo-bucket: nonmus-channel

aws:
  region: us-east-1
  s3:
    endpoint: http://localhost.floci.io:4566
  access-key: test
  secret-key: test
