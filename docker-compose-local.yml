services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: nonmus_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=nonmus
    volumes:
      - nonmus_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nonmus" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nonmus-net

  redis:
    image: redis
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nonmus-net

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
       - floci-data:/app/data
    networks:
      - nonmus-net

volumes:
  nonmus_data:
  redis_data:
  floci-data:

networks:
  nonmus-net:
    driver: bridge
